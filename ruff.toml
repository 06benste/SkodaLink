target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "D"]
ignore = ["E501", "D203", "D213", "PLR0911", "PLR0912", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003", "RUF012", "D105", "D107"]

[lint.per-file-ignores]
"tests/*" = ["D103", "PLC0415", "PLR0917"]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
